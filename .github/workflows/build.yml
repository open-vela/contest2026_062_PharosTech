name: build

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]

  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

env:
  # manifest 仓库：push / workflow_dispatch 用自身仓库；PR 事件使用目标仓库（base）。
  # PR 的测试合并提交只存在于目标(base)仓库，fork 仓库中无此 commit。
  MANIFEST_REPO: ${{ format('{0}/{1}', github.server_url, github.repository) }}
  # 与本次 Actions 事件和 checkout 默认行为一致：PR 为测试合并提交，其余为当前提交。
  # pull_request.merge_commit_sha 在 synchronize 事件中可能仍指向上一版合并树。
  MANIFEST_COMMIT: ${{ github.sha }}
  # 仓库名即 manifest 文件名
  REPO_NAME: ${{ github.event.repository.name }}
  MANIFEST_FILE: ${{ github.event.repository.name }}.xml
  # repo sync 的工作目录（workspace 下的 openvela 子目录）
  OPENVELA_DIR: openvela

jobs:
  release_tools:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tooling
        run: |
          python3 -m py_compile \
            tools/sync_nboot_release.py \
            tools/test_sync_nboot_release.py \
            tools/k7_abpack/bootctrl.py \
            tools/k7_abpack/test_bootctrl.py
          python3 tools/test_sync_nboot_release.py
          python3 tools/k7_abpack/test_bootctrl.py
          python3 tools/tests/test_nbootctl_records.py
          bash -n tools/k7_pack/build_nboot_ab.sh
          bash -n tools/k7_pack/build_sd.sh
          bash -n tools/k7_pack/build_emmc.sh
          bash -n tools/k7_pack/build_legacy_sd.sh
          TAG=$(cat boards/rk3576/kickpi-k7/nboot/RELEASE)
          python3 tools/sync_nboot_release.py \
            --assets boards/rk3576/kickpi-k7/nboot \
            --output "$RUNNER_TEMP/verified-nboot" \
            --tag "$TAG"

  amp_tools:
    name: AMP control and packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FIT test tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler u-boot-tools
      - name: Test AMP tools
        run: |
          python3 tools/amp/test_amp_topology.py
          python3 tools/amp/test_manifest_layout.py
          cmake -S tools/amp/nyampd -B out/nyampd
          cmake --build out/nyampd -j2
          ctest --test-dir out/nyampd --output-on-failure
          python3 tools/amp/test_application_pty.py . out/nyampd/nyampd

  core_build_contract:
    name: Core dependency configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preserve WAMR-owned context configuration
        run: |
          for context in 0 1; do
            cmake -S tools/nyabula_core/tests/cmake \
              -B "out/core-wamr-$context" -DNYCORE_TEST_CONTEXT="$context"
            cmake --build "out/core-wamr-$context"
          done
          python3 tools/nyabula_core/tests/test_display_ownership.py

  # 扫描 defconfig，生成 build matrix
  scan_configs:
    name: Scan Configs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MANIFEST_COMMIT }}

      - name: Scan configs
        id: matrix
        run: |
          CONFIGS='[]'
          for cfg in $(find "boards" "configs" -name defconfig -printf '%h\n' | sort); do
            CONFIGS=$(echo "$CONFIGS" | jq -c --arg c "$cfg" '. + [{"config": $c}]')
          done
          echo "matrix=$CONFIGS" >> $GITHUB_OUTPUT
          echo "Discovered configs: $CONFIGS"

  # 并行构建所有配置
  build:
    name: Build (${{ matrix.config }})
    needs: scan_configs
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.scan_configs.outputs.matrix) }}

    steps:
      # 生成 artifact 名称 slug
      - name: Generate config slug
        run: |
          SLUG="${{ matrix.config }}"
          echo "CONFIG_SLUG=${SLUG//\//_}" >> "$GITHUB_ENV"

      # 安装构建依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl cmake python3 libc++abi-dev build-essential

      # 安装 repo 工具
      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 拉取 openvela 全量源码
      - name: Repo init & sync
        run: |
          mkdir -p ${{ env.OPENVELA_DIR }}
          cd ${{ env.OPENVELA_DIR }}
          repo init \
            -u "${{ env.MANIFEST_REPO }}" \
            -b "${{ env.MANIFEST_COMMIT }}" \
            -m "${{ env.MANIFEST_FILE }}" \
            --depth=1
          repo sync -c -j4

      # 签出到目标 commit（repo sync 拉下的是 manifest 默认 revision）
      - name: Checkout contest repo to target commit
        run: |
          cd ${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}
          git remote add ci "${{ env.MANIFEST_REPO }}" || true
          git fetch ci ${{ env.MANIFEST_COMMIT }}
          git checkout FETCH_HEAD

      # Public CI does not contain redistributable SeekWave firmware.  Create
      # exact-size, zero-filled inputs so both build systems still exercise
      # the complete SV6621 integration.  Runtime code recognizes the full
      # placeholder set, leaves Wi-Fi disabled, and continues system startup.
      - name: Generate SV6621 firmware placeholders
        shell: bash
        run: |
          FIRMWARE_DIR="${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}/drivers/drivers/sv6621/firmware"
          mkdir -p "$FIRMWARE_DIR"
          make_placeholder() {
            local path="$1"
            local size="$2"
            : > "$path"
            truncate -s "$size" "$path"
          }
          make_placeholder "$FIRMWARE_DIR/SWT6621S_IRAM_SDIO.bin" 356616
          make_placeholder "$FIRMWARE_DIR/SWT6621S_DRAM_SDIO.bin" 193224
          make_placeholder "$FIRMWARE_DIR/SWT6621S_NV_SDIO_ALONE.bin" 220
          make_placeholder "$FIRMWARE_DIR/SWT6621S_SEEKWAVE_R00001.bin" 2372

      - name: Apply AMP GIC dependency
        if: matrix.config == 'boards/rk3576/kickpi-k7/configs/amp'
        run: |
          bash "${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}/tools/amp/nuttx/apply.sh" \
            "${{ env.OPENVELA_DIR }}/nuttx"

      # CMake 构建
      - uses: actions/setup-node@v4
        if: matrix.config == 'configs/core_eye'
        with:
          node-version: '22'

      - name: Generate Eye glyph tables from official Noto Sans
        if: matrix.config == 'configs/core_eye'
        run: |
          cd ${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}
          python3 app/nyabula/tools/test_generate_fonts.py
          python3 app/nyabula/tools/generate_fonts.py --download-fallback

      - name: Build (CMake)
        id: cmake_build
        continue-on-error: true
        run: |
          cd ${{ env.OPENVELA_DIR }}
          ./build.sh ${{ env.REPO_NAME }}/${{ matrix.config }} --cmake

      - name: Upload CMake artifact
        if: steps.cmake_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONFIG_SLUG }}-cmake
          path: ${{ env.OPENVELA_DIR }}/cmake_out/**/nuttx.bin
          if-no-files-found: error

      - name: Upload Eye font attribution
        if: matrix.config == 'configs/core_eye'
        uses: actions/upload-artifact@v4
        with:
          name: core-eye-font-notices
          path: |
            ${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}/app/nyabula/res/fonts/NOTICE-NOTO-SANS.txt
            ${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}/app/nyabula/res/fonts/LICENSE-NOTO-SANS.txt
            ${{ env.OPENVELA_DIR }}/${{ env.REPO_NAME }}/app/nyabula/src/generated/fonts/font-manifest.json
          if-no-files-found: error

      # Makefile 构建
      - name: Build (Makefile)
        id: make_build
        continue-on-error: true
        run: |
          cd ${{ env.OPENVELA_DIR }}
          ./build.sh ${{ env.REPO_NAME }}/${{ matrix.config }} distclean
          ./build.sh ${{ env.REPO_NAME }}/${{ matrix.config }} -j4

      - name: Upload Makefile artifact
        if: steps.make_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONFIG_SLUG }}-makefile
          path: ${{ env.OPENVELA_DIR }}/nuttx/nuttx.bin
          if-no-files-found: error

      # 任一构建失败则 job 失败
      - name: Check build results
        if: steps.cmake_build.outcome == 'failure' || steps.make_build.outcome == 'failure'
        run: |
          echo "::error::CMake outcome: ${{ steps.cmake_build.outcome }}, Makefile outcome: ${{ steps.make_build.outcome }}"
          exit 1
